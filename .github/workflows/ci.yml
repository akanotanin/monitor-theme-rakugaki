name: ci

on:
  push:
    branches: [master]
    # Prose changes nothing a compiler or linter can check.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]

# A new push supersedes any run still in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hub embeds a released archive, never this repository's source: release.yml
  # builds a tag here and publishes theme.tar.gz, while the hub's web-theme.pin
  # names the tag and its sha256. A break on main therefore cannot break a hub
  # build, but this is the only gate a tag receives, since by the time the hub sees
  # it the build has already happened here. Shipping to a hub is two steps: tag
  # here, then move that pin there.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npm run build

  # 真机护栏：用 `npm run guard` 伺服 dist/ 跑无头 Chrome。★2026-11-23 加：这些脚本原来
  # **只在本机手动跑**，CI 里一个都没执行过，于是「本地全绿」既有「忘了 build 的旧产物」
  # 也有「CI 根本没验」两层虚。
  #
  # ★不要再在 workflow 里手抄脚本清单：抄过一次就漂了（当时抄了 18 支，而 `npm run guard`
  #   的默认批是 35 支，17 支从来没在 CI 里跑过）。这里只调入口，清单只有 tools/_run-guards.mjs
  #   一份。分片按「清单里的位置」取模，改清单不需要动 workflow。
  # `npm run build` 先跑一遍：护栏自己也会在 dist 落后时 exit 1，那报错比 build 失败更难读。
  guards:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 确认有可用的 Chrome/Chromium
        # ubuntu-latest 镜像自带 google-chrome（`/usr/bin/google-chrome`），tools/_chrome.mjs
        # 的探测链认得它；这里只是把结论打出来，找不到就让整步红掉（比后面一堆脚本超时好查）。
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "::error::runner 上没有 chrome/chromium，护栏无法运行"
            exit 1
          fi
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version
      - name: 护栏（分片 ${{ matrix.shard }}/2）
        run: npm run guard -- --shard ${{ matrix.shard }}/2

